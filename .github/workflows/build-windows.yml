name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        working-directory: v2
        run: npm install
      - name: Generate valid icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path v2/src-tauri/icons | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 32,32
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(37,99,235))
          $g.Dispose()
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $stream = [System.IO.File]::Create((Join-Path $PWD 'v2/src-tauri/icons/icon.ico'))
          $icon.Save($stream)
          $stream.Close()
          $icon.Dispose()
          $bmp.Dispose()
      - name: Build NSIS installer
        working-directory: v2
        run: npm run tauri build -- --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CMMS-Windows-Installer
          path: v2/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
